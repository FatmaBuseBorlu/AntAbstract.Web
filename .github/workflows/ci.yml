name: CI

on:
  push:
    branches: [ master, main, develop, update ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AntAbstract.Web.sln

      - name: Check code formatting
        run: dotnet format AntAbstract.Web.sln --verify-no-changes --no-restore

      - name: Build (no warnings as errors)
        run: dotnet build AntAbstract.Web.sln --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test AntAbstract.Web.sln
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
        env:
          ASPNETCORE_ENVIRONMENT: Testing

      - name: Verify EF Core migrations compile
        env:
          ASPNETCORE_ENVIRONMENT: Testing
        run: |
          dotnet tool install --global dotnet-ef --version 8.* 2>/dev/null || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Migration metadata'sını design-time factory ile doğrula; canlı DB'ye bağlanmaz.
          dotnet ef migrations list \
            --project AntAbstract.Infrastructure \
            --startup-project AntAbstract.Infrastructure \
            --no-build \
            --configuration Release \
            --no-connect 2>&1 || {
              echo "::error::EF Core migration derleme hatası. Migration dosyalarını kontrol edin."
              exit 1
            }
          echo "✅ EF Core migration'lar derlenebilir durumda."

      - name: Dependency vulnerability audit
        run: >
          dotnet list AntAbstract.Web.sln package --vulnerable --include-transitive
          | tee /tmp/vuln.txt
          && ! grep -q "has the following vulnerable packages" /tmp/vuln.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
          retention-days: 7

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
